# 每次 push／PR 都驗證：多語系、GA4、SEO、規則單元測試，以及真的開伺服器打一場線上對戰。
name: 測試
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    name: 規則與線上流程
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 單元測試（多語系、GA4、SEO、規則）
        run: npm test
      - name: 線上流程實測（開伺服器、邀請、觀戰、斷線重連、零玩家關房、延遲 ping）
        run: node scripts/online-check.js
  browser:
    name: 瀏覽器多語系與版面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 啟動伺服器並檢查繁中以外的語系
        run: |
          node server.js &
          sleep 3
          node scripts/i18n-check.js
